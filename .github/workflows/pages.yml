name: Deploy Gear Ledger to Pages
on:
  # Heartbeat pushes ~18 commits per 10-min cycle; per-push deploys caused
  # 20k+ runs/day with cancel-storms and deploy-pages collisions.
  # Hourly scheduled deploy keeps the world fresh without the storm.
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
